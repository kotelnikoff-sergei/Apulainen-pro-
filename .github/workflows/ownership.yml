name: ownership
# Fails when a PR changes the other owner's pages or shared files without the other owner's approval.
# Rules: ownership.json, AGENTS.md. Re-runs automatically when someone approves the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check page ownership
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE"
          APPROVED=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | join(",")')
          python3 tools/check_ownership.py --login "$AUTHOR" "origin/$BASE" --approved-by "$APPROVED"
